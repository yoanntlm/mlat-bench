name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly oracle image build: catches upstream/dependency rot (pip, Cython,
    # base image) before it blocks a working session.
    - cron: "17 6 * * 1"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  oracle-image:
    runs-on: ubuntu-latest
    # PRs that don't touch the oracle don't need a 5-minute image build.
    if: github.event_name == 'schedule' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f oracle/compose.yaml build
