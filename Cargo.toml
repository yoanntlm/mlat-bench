[workspace]
resolver = "2"
members = [
    "crates/mb-core",
    "crates/mb-modes",
    "crates/mb-proto",
    "crates/mb-sim",
    "crates/mb-capture",
    "crates/mb-metrics",
    "crates/mlat-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/flightportrait/mlat-bench"

[workspace.dependencies]
# Shared internal crates
mb-core = { path = "crates/mb-core" }
mb-modes = { path = "crates/mb-modes" }
mb-proto = { path = "crates/mb-proto" }
mb-sim = { path = "crates/mb-sim" }
mb-capture = { path = "crates/mb-capture" }
mb-metrics = { path = "crates/mb-metrics" }

# External. Kept few and boring on purpose: this repo wants to be auditable
# by strangers in an afternoon.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_chacha = "0.3"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
flate2 = "1"            # zlib framing (mlat-server "zlib"/"zlib2" compression)
zstd = "0.13"           # capture file compression
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"

[profile.release]
debug = true            # keep symbols; perf work on the replay engine wants them
