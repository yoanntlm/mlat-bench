# valley — the 4-receiver geometry gauntlet. Four receivers strung along a
# valley floor (near-collinear, 7 km apart), a fifth far enough away to hear
# only the cruise traffic. Low, slow, turning targets off to one side of the
# line: a police helicopter orbiting a scene at 70 kt, a rescue helicopter
# at 120 kt, a GA crossing. Every fix on them is a 4-receiver solve with
# poor GDOP across the line, so the solver's 4-receiver gate and track
# model are what is measured. Reported by ADSBItalia (610 feeders, 0.4.8):
# "zig-zag" tracks on 4-receiver solves of maneuvering rotorcraft in hilly
# terrain. No multipath here; the ambiguity is geometric.

[meta]
name = "valley"
seed = 42
duration_s = 600

[network]
latency_ms_min = 5.0
latency_ms_max = 40.0

# --- receivers: along lon −1.50 with a few hundred metres of scatter ----

[[receivers]]
id = "rx-000"
lat = 47.000
lon = -1.505
alt_m = 60
clock = { type = "radarcape_gps" }

[[receivers]]
id = "rx-001"
lat = 47.063
lon = -1.492
alt_m = 90
clock = { type = "dump1090", offset_ppm = 3.2, drift_ppm_per_hr = 0.05, jitter_ns = 45 }

[[receivers]]
id = "rx-002"
lat = 47.127
lon = -1.508
alt_m = 75
clock = { type = "dump1090", offset_ppm = -7.8, drift_ppm_per_hr = 0.02, jitter_ns = 60 }
loss_prob = 0.05

[[receivers]]
id = "rx-003"
lat = 47.190
lon = -1.497
alt_m = 110
clock = { type = "dump1090", offset_ppm = 12.5, drift_ppm_per_hr = 0.10, jitter_ns = 55 }

# Far receiver: past the radio horizon of anything below ~3000 ft here.
[[receivers]]
id = "rx-004"
lat = 48.55
lon = -1.50
alt_m = 40
clock = { type = "dump1090", offset_ppm = -1.1, drift_ppm_per_hr = 0.03, jitter_ns = 45 }

# --- ADS-B aircraft: the sync sources, at cruise over everyone -----------

[[aircraft]]
icao = "3C6444"
kind = "adsb"
traj = { type = "great_circle", from = [46.40, -2.60, 35000], to = [48.10, -0.40, 35000], gs_kts = 460 }

[[aircraft]]
icao = "4CA2B7"
kind = "adsb"
traj = { type = "great_circle", from = [48.20, -2.30, 37000], to = [46.40, -0.75, 37000], gs_kts = 470 }

[[aircraft]]
icao = "406A9E"
kind = "adsb"
traj = { type = "great_circle", from = [46.60, -0.55, 33000], to = [48.30, -2.55, 33000], gs_kts = 450 }

[[aircraft]]
icao = "39856C"
kind = "adsb"
traj = { type = "great_circle", from = [48.40, -0.60, 39000], to = [46.50, -2.45, 39000], gs_kts = 480 }

[[aircraft]]
icao = "484B12"
kind = "adsb"
traj = { type = "great_circle", from = [46.40, -1.55, 36000], to = [48.60, -1.50, 36000], gs_kts = 455 }

[[aircraft]]
icao = "3C0FF1"
kind = "adsb"
traj = { type = "great_circle", from = [47.20, -2.70, 38000], to = [47.50, -0.35, 38000], gs_kts = 465 }

[[aircraft]]
icao = "4B1789"
kind = "adsb"
traj = { type = "great_circle", from = [48.00, -2.60, 32000], to = [46.70, -0.45, 32000], gs_kts = 440 }

[[aircraft]]
icao = "A1B2C3"
kind = "adsb"
traj = { type = "great_circle", from = [48.30, -1.10, 34000], to = [46.50, -2.00, 34000], gs_kts = 445 }

# --- Mode-S-only targets: low, slow, turning, east of the line -----------

# Police helicopter holding over a scene 6 km east of the valley.
[[aircraft]]
icao = "3A0001"
kind = "modes_only"
df11_rate_hz = 1.0
df4_rate_hz = 5.0
traj = { type = "orbit", center = [47.095, -1.420, 1500], radius_m = 1200.0, gs_kts = 70 }

# Rescue helicopter, wider and faster orbit, the other way round.
[[aircraft]]
icao = "3A0002"
kind = "modes_only"
df11_rate_hz = 1.0
df4_rate_hz = 4.0
traj = { type = "orbit", center = [47.150, -1.400, 2000], radius_m = 2500.0, gs_kts = 120, clockwise = true }

# GA crossing the valley low at 100 kt.
[[aircraft]]
icao = "3A0003"
kind = "modes_only"
df11_rate_hz = 0.8
df4_rate_hz = 3.0
traj = { type = "great_circle", from = [47.02, -1.30, 2500], to = [47.22, -1.72, 2500], gs_kts = 100 }
